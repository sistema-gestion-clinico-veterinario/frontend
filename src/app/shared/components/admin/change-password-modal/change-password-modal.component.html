<div class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/40">
  <div class="bg-white w-full max-w-md rounded-lg border border-slate-200 flex flex-col overflow-hidden">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
      <div>
        <h2 class="text-base font-bold text-slate-800">Cambiar Contraseña</h2>
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Usuario: {{ userName() }}</p>
      </div>
      <button (click)="close()" class="text-slate-400 hover:text-slate-600 p-2">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6">
      <div class="mb-6 p-3 bg-amber-50 border border-amber-200 rounded text-amber-800 text-[11px] leading-relaxed flex gap-3">
        <i class="pi pi-exclamation-triangle text-amber-500 mt-0.5"></i>
        <p>Se enviará una notificación por correo electrónico informando sobre este cambio de seguridad.</p>
      </div>

      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wide ml-0.5">Nueva Contraseña <span class="text-rose-500">*</span></label>
          <div class="relative">
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              formControlName="newPassword"
              placeholder="Mínimo 6 caracteres"
              class="w-full px-3 py-2 border border-slate-300 rounded text-sm outline-none h-10 bg-white focus:border-blue-500"
            />
            <button 
              type="button" 
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
            >
              <i class="pi" [ngClass]="showPassword() ? 'pi-eye-slash' : 'pi-eye'"></i>
            </button>
          </div>
          <p *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid" class="text-[10px] text-rose-500 ml-0.5 font-medium">
            Mínimo 6 caracteres requeridos
          </p>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wide ml-0.5">Confirmar Contraseña <span class="text-rose-500">*</span></label>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="confirmPassword"
            placeholder="Repite la nueva contraseña"
            class="w-full px-3 py-2 border border-slate-300 rounded text-sm outline-none h-10 bg-white focus:border-blue-500"
          />
          <p *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched" class="text-[10px] text-rose-500 ml-0.5 font-medium">
            Las contraseñas no coinciden
          </p>
        </div>

        <!-- Footer Actions -->
        <div class="flex justify-end gap-3 pt-6 border-t border-slate-100">
          <button type="button" (click)="close()"
            class="px-5 py-2 text-xs font-bold text-slate-500 hover:bg-slate-100 rounded">
            CANCELAR
          </button>
          <button type="submit" [disabled]="loading() || passwordForm.invalid"
            class="px-6 py-2 text-xs font-bold text-white bg-[#0066AA] hover:bg-[#005a96] rounded disabled:bg-slate-200 disabled:text-slate-400 flex items-center justify-center gap-2 min-w-[140px]">
            <i *ngIf="loading()" class="pi pi-spin pi-spinner text-[10px]"></i>
            {{ loading() ? 'PROCESANDO...' : 'ACTUALIZAR CLAVE' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<p-toast position="bottom-right"></p-toast>
