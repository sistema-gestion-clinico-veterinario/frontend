<section role="alert" class="border border-slate-200 bg-white px-6 py-14 text-center sm:py-20">
  <div class="mx-auto mb-6 flex justify-center text-[var(--brand-primary)]" aria-hidden="true">
    @switch (motivo()) {
      @case ('NO_ENCONTRADO') {
        <svg viewBox="0 0 24 24" class="size-20 sm:size-24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <path d="M14 2v6h6" />
          <circle cx="11.5" cy="14.5" r="2.5" />
          <path d="m13.3 16.3 1.7 1.7" />
        </svg>
      }
      @case ('SIN_PERMISO') {
        <svg viewBox="0 0 24 24" class="size-20 sm:size-24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          <circle cx="12" cy="16.5" r="1" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 24 24" class="size-20 sm:size-24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 2 20 20" />
          <path d="M5.78 5.78A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.31-.19" />
          <path d="M21.53 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7 7 0 0 0 10 5.07" />
        </svg>
      }
    }
  </div>
  <h2 class="text-xl font-extrabold text-slate-900 sm:text-2xl">{{ contenido().titulo }}</h2>
  <p class="mx-auto mt-3 max-w-lg text-sm leading-6 text-slate-500 sm:text-base sm:leading-7">{{ contenido().detalle }}</p>
  <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
    <button type="button" (click)="volver.emit()"
      class="inline-flex h-11 items-center justify-center gap-2 border border-slate-300 bg-white px-6 text-sm font-bold text-slate-600 hover:bg-slate-50">
      <i class="pi pi-arrow-left text-xs"></i> {{ etiquetaVolver() }}
    </button>
    @if (motivo() === 'FALLO') {
      <button type="button" (click)="reintentar.emit()"
        class="inline-flex h-11 items-center justify-center gap-2 bg-blue-500 px-6 text-sm font-bold text-white hover:bg-blue-600">
        <i class="pi pi-refresh text-xs"></i> Reintentar
      </button>
    }
  </div>
</section>
