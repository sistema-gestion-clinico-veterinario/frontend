<div *ngIf="loadingStore.isLoading()" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white/80 backdrop-blur-[2px]">
  <div class="flex flex-col items-center gap-4">
    <img
      [src]="loadingSrc"
      alt="Loading"
      class="w-24 h-24 object-contain loader-pulse" />
    <div class="text-center">
      <p class="text-sm font-extrabold text-slate-800">Cargando...</p>
      <p class="mt-1 text-xs font-medium text-slate-500">Preparando información.</p>
    </div>
  </div>
</div>
