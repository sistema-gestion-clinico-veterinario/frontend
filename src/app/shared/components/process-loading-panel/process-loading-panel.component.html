<div *ngIf="visible()"
  class="fixed inset-0 z-[9999] flex items-end justify-center bg-slate-950/25 backdrop-blur-[2px] sm:items-stretch sm:justify-end animate-fade-in">
  <aside class="w-full max-h-[88dvh] overflow-hidden rounded-t-2xl border border-slate-200 bg-white shadow-2xl sm:h-full sm:max-h-none sm:w-[380px] sm:rounded-none sm:border-y-0 sm:border-r-0">
    <div class="flex h-full flex-col">
      <div class="border-b border-slate-100 px-5 py-5">
        <div class="flex items-start gap-3">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-[#0066AA]/10 text-[#0066AA]">
            <i class="pi pi-cloud-upload text-base"></i>
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-xs font-black uppercase tracking-widest text-slate-400">Procesando</p>
            <h2 class="mt-1 text-base font-extrabold leading-tight text-slate-800">{{ loadingStore.processTitle() }}</h2>
            <p class="mt-1 text-xs font-medium leading-relaxed text-slate-500">Mantén esta ventana abierta mientras terminamos la operación.</p>
          </div>
        </div>

        <div class="mt-5 h-1.5 overflow-hidden rounded-full bg-slate-100">
          <div class="h-full rounded-full bg-[#0066AA] transition-all duration-500" [style.width.%]="progress()"></div>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto px-5 py-5">
        <div class="space-y-3">
          <div *ngFor="let step of loadingStore.processSteps(); let i = index"
            class="flex items-start gap-3 rounded-xl border px-3 py-3 transition-all"
            [ngClass]="isActive(i) ? 'border-[#0066AA]/30 bg-blue-50/70' : isCompleted(i) ? 'border-emerald-100 bg-emerald-50/60' : 'border-slate-100 bg-slate-50/70'">
            <div class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg transition-all"
              [ngClass]="isActive(i) ? 'bg-[#0066AA] text-white' : isCompleted(i) ? 'bg-emerald-500 text-white' : 'bg-white text-slate-300 border border-slate-200'">
              <i *ngIf="isCompleted(i)" class="pi pi-check text-[10px]"></i>
              <i *ngIf="isActive(i)" class="pi pi-spin pi-spinner text-[10px]"></i>
              <span *ngIf="!isCompleted(i) && !isActive(i)" class="text-[10px] font-black">{{ i + 1 }}</span>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-bold leading-snug" [ngClass]="isActive(i) ? 'text-slate-800' : isCompleted(i) ? 'text-emerald-700' : 'text-slate-500'">
                {{ step }}
              </p>
              <p *ngIf="isActive(i)" class="mt-1 text-[11px] font-medium text-slate-500">Esto puede tomar unos segundos.</p>
            </div>
          </div>
        </div>
      </div>

      <div class="border-t border-slate-100 bg-slate-50 px-5 py-4">
        <p class="flex items-center gap-2 text-[11px] font-semibold text-slate-500">
          <i class="pi pi-shield text-[#0066AA]"></i>
          Estamos validando la operación de forma segura.
        </p>
      </div>
    </div>
  </aside>
</div>
