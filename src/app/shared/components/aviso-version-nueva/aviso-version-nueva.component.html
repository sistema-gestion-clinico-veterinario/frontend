@if (version.disponible()) {
  <div role="alert" class="fixed inset-x-0 top-0 z-[10000] flex flex-wrap items-center justify-between gap-x-4 gap-y-2 bg-blue-700 px-5 py-3 text-white">
    <span class="flex min-w-0 items-center gap-3 text-sm font-semibold">
      <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4M12 8h.01" />
      </svg>
      Hay una versión nueva de SoftVet. Actualiza la página para seguir trabajando.
    </span>
    <button type="button" class="inline-flex shrink-0 items-center gap-2 rounded-lg bg-white px-4 py-2 text-sm font-bold text-blue-700 hover:bg-blue-50" (click)="version.recargar()">
      <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
        <path d="M21 3v5h-5" />
      </svg>
      Actualizar
    </button>
  </div>
}
