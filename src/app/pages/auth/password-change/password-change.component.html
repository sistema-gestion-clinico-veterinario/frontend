<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6 font-['Barlow']">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
    
    <div class="text-center mb-8">
      <!-- Padlock Icon Container -->
      <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-4">
        <i class="pi pi-lock text-xl"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">Cambiar Contraseña</h1>
      <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1.5">
        Actualiza las credenciales de tu cuenta
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <!-- Old Password -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-slate-700 ml-0.5">Contraseña Actual <span class="text-rose-500">*</span></label>
        <div class="relative">
          <input [type]="showOld() ? 'text' : 'password'" formControlName="oldPassword"
            placeholder="Ingrese su contraseña actual"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-[#0066AA] focus:ring-1 focus:ring-[#0066AA] outline-none h-10 transition-all duration-150 text-slate-800" />
          <button type="button" (click)="showOld.set(!showOld())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
            <i [class]="showOld() ? 'pi pi-eye-slash text-xs' : 'pi pi-eye text-xs'"></i>
          </button>
        </div>
        <p *ngIf="form.get('oldPassword')?.touched && form.get('oldPassword')?.invalid" class="text-[10px] text-rose-500 font-bold mt-1">
          Este campo es requerido.
        </p>
      </div>

      <!-- New Password -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-slate-700 ml-0.5">Nueva Contraseña <span class="text-rose-500">*</span></label>
        <div class="relative">
          <input [type]="showNew() ? 'text' : 'password'" formControlName="newPassword"
            placeholder="Mínimo 6 caracteres"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-[#0066AA] focus:ring-1 focus:ring-[#0066AA] outline-none h-10 transition-all duration-150 text-slate-800" />
          <button type="button" (click)="showNew.set(!showNew())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
            <i [class]="showNew() ? 'pi pi-eye-slash text-xs' : 'pi pi-eye text-xs'"></i>
          </button>
        </div>

        <!-- Password Strength Meter -->
        <div *ngIf="form.get('newPassword')?.value" class="mt-2 space-y-1">
          <div class="flex gap-1 h-1">
            <div *ngFor="let i of [0, 1, 2, 3]" [class]="strengthClass(i)" class="flex-1 rounded-full transition-all duration-300"></div>
          </div>
          <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase tracking-wider">
            <span>Seguridad:</span>
            <span [ngClass]="{
              'text-rose-500': passwordStrength <= 1,
              'text-amber-500': passwordStrength === 2,
              'text-blue-500': passwordStrength === 3,
              'text-emerald-500': passwordStrength === 4
            }">{{ strengthLabel() }}</span>
          </div>
        </div>

        <p *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.invalid" class="text-[10px] text-rose-500 font-bold mt-1">
          La contraseña debe tener al menos 6 caracteres.
        </p>
      </div>

      <!-- Confirm Password -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-slate-700 ml-0.5">Confirmar Nueva Contraseña <span class="text-rose-500">*</span></label>
        <div class="relative">
          <input [type]="showConfirm() ? 'text' : 'password'" formControlName="confirmPassword"
            placeholder="Repita la nueva contraseña"
            class="w-full px-3 py-2 rounded-lg text-sm outline-none h-10 transition-all duration-150 text-slate-800"
            [class]="form.errors?.['mismatch'] && form.get('confirmPassword')?.dirty
              ? 'border border-rose-300 focus:border-rose-500 focus:ring-1 focus:ring-rose-500'
              : 'border border-slate-300 focus:border-[#0066AA] focus:ring-1 focus:ring-[#0066AA]'" />
          <button type="button" (click)="showConfirm.set(!showConfirm())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
            <i [class]="showConfirm() ? 'pi pi-eye-slash text-xs' : 'pi pi-eye text-xs'"></i>
          </button>
        </div>
        <p *ngIf="form.errors?.['mismatch'] && form.get('confirmPassword')?.dirty" class="text-[10px] text-rose-500 font-bold mt-1">
          Las contraseñas no coinciden.
        </p>
      </div>

      <!-- Error Message Box -->
      <div *ngIf="errorMsg()" class="flex items-center gap-2 bg-rose-50 text-rose-600 text-xs font-semibold px-3.5 py-2.5 rounded-lg border border-rose-100">
        <i class="pi pi-exclamation-circle text-sm shrink-0"></i>
        <span>{{ errorMsg() }}</span>
      </div>

      <!-- Buttons -->
      <div class="flex flex-col gap-3 pt-4 border-t border-slate-100">
        <button type="submit" [disabled]="form.invalid || isSubmitting()"
          class="w-full h-10 bg-[#0066AA] hover:bg-[#005a96] disabled:opacity-60 text-white rounded-lg text-sm font-semibold transition-all flex items-center justify-center gap-2 cursor-pointer">
          <i *ngIf="isSubmitting()" class="pi pi-spin pi-spinner text-xs"></i>
          {{ isSubmitting() ? 'Guardando...' : 'Cambiar Contraseña' }}
        </button>
        <button type="button" (click)="cancel()" [disabled]="isSubmitting()"
          class="w-full h-10 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-semibold transition-all active:scale-[0.98] cursor-pointer">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>

<p-toast position="bottom-right"></p-toast>
