<main class="grid min-h-screen bg-white font-['Barlow'] lg:grid-cols-2">
  <section class="order-2 flex flex-col justify-center px-6 py-12 sm:px-12 lg:order-1 lg:px-16 xl:px-24">
    <div class="mx-auto w-full max-w-xl text-center lg:mx-0 lg:text-left">
      <p class="text-xs font-bold uppercase tracking-[.2em] text-[var(--brand-primary)]">Error 404</p>
      <p class="mt-3 text-8xl font-extrabold leading-none tracking-tight text-[var(--brand-primary)] sm:text-9xl" aria-hidden="true">404</p>
      <h1 class="mt-5 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">No encontramos esta página</h1>
      <p class="mx-auto mt-4 max-w-md text-base leading-7 text-slate-500 lg:mx-0">
        La dirección que buscas no existe o fue movida. Revisa que esté bien escrita o regresa al inicio para continuar.
      </p>

      <div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:justify-center lg:justify-start">
        <button type="button" (click)="volver()"
          class="inline-flex h-12 items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-6 text-sm font-bold text-slate-600 hover:bg-slate-50">
          <i class="pi pi-arrow-left text-xs"></i> Volver atrás
        </button>
        <button type="button" (click)="irAlInicio()"
          class="inline-flex h-12 items-center justify-center gap-2 rounded-lg bg-[var(--brand-primary)] px-7 text-sm font-bold text-white hover:brightness-95">
          <i [class]="haySesion ? 'pi pi-home text-xs' : 'pi pi-sign-in text-xs'"></i>
          {{ haySesion ? 'Ir al inicio' : 'Ir al inicio de sesión' }}
        </button>
      </div>
    </div>
  </section>

  <section class="relative order-1 flex min-h-[18rem] items-center justify-center overflow-hidden bg-blue-50 px-6 py-10 lg:order-2 lg:min-h-screen" aria-hidden="true">
    <div class="absolute -right-24 -top-24 size-80 rounded-full bg-blue-500/5"></div>
    <div class="absolute -bottom-32 -left-16 size-[28rem] rounded-full bg-blue-500/5"></div>
    <div class="relative grid size-64 place-items-center rounded-full bg-blue-500/10 sm:size-80 lg:size-[28rem] xl:size-[34rem]">
      <img src="/assets/images/login-pets.webp" alt="" width="467" height="456"
        class="h-auto w-[88%] object-contain" decoding="async" />
      <span class="absolute right-2 top-8 grid size-14 place-items-center rounded-full bg-white text-[var(--brand-primary)] lg:right-6 lg:top-14 lg:size-20">
        <span class="text-2xl font-extrabold lg:text-4xl">?</span>
      </span>
    </div>
  </section>
</main>
