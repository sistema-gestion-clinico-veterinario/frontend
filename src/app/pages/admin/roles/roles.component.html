<p-toast position="top-right" />

<div class="p-8 min-h-screen bg-slate-50 font-['Barlow']">
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Gestión de Roles y Permisos</h1>
    <p class="text-slate-500 font-medium mt-1 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-[#0066AA]"></span>
      Configura qué puede hacer cada rol sin reiniciar el servidor
    </p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Panel izquierdo: lista de roles -->
    <div class="lg:col-span-1">
      <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Roles</p>
        </div>
        <div class="divide-y divide-slate-50">
          <button *ngFor="let role of roles()"
            (click)="selectRole(role)"
            [class.bg-blue-50]="selectedRole()?.id === role.id"
            [class.border-l-2]="selectedRole()?.id === role.id"
            [class.border-l-[#0066AA]]="selectedRole()?.id === role.id"
            class="w-full text-left px-4 py-3.5 hover:bg-slate-50 transition-colors">
            <p [class.text-[#0066AA]]="selectedRole()?.id === role.id"
               [class.font-semibold]="selectedRole()?.id === role.id"
               class="text-sm text-slate-700">{{ roleLabel(role.name) }}</p>
            <p class="text-xs text-slate-400 mt-0.5">{{ role.permissions.length }} permisos</p>
          </button>
        </div>
      </div>
    </div>

    <!-- Panel derecho: permisos del rol seleccionado -->
    <div class="lg:col-span-3">
      <div *ngIf="!selectedRole()" class="bg-white border border-slate-200 rounded-xl flex items-center justify-center h-64">
        <div class="text-center">
          <i class="pi pi-shield text-3xl text-slate-200 block mb-3"></i>
          <p class="text-sm text-slate-400">Selecciona un rol para ver y editar sus permisos</p>
        </div>
      </div>

      <div *ngIf="selectedRole()" class="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 class="text-base font-bold text-slate-800">{{ roleLabel(selectedRole()!.name) }}</h2>
            <p class="text-xs text-slate-400 mt-0.5">{{ pendingIds().size }} permisos activos</p>
          </div>
          <div class="flex gap-2" *ngIf="isDirty()">
            <button (click)="discard()"
              class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 transition-colors">
              Descartar
            </button>
            <button (click)="save()"
              class="px-4 py-1.5 rounded-lg bg-[#0066AA] text-white text-xs font-medium hover:bg-[#005a96] transition-colors">
              Guardar cambios
            </button>
          </div>
        </div>

        <!-- Permisos por módulo -->
        <div class="p-6 space-y-6">
          <div *ngFor="let entry of modules() | keyvalue">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">{{ entry.key }}</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
              <label *ngFor="let perm of entry.value"
                class="flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition-colors"
                [class.border-blue-200]="hasPermission(perm.id)"
                [class.bg-blue-50]="hasPermission(perm.id)"
                [class.border-slate-100]="!hasPermission(perm.id)"
                [class.hover:bg-slate-50]="!hasPermission(perm.id)">
                <input type="checkbox"
                  [checked]="hasPermission(perm.id)"
                  (change)="togglePermission(perm.id)"
                  class="mt-0.5 w-4 h-4 accent-[#0066AA] shrink-0 cursor-pointer" />
                <div>
                  <p class="text-xs font-semibold text-slate-700 leading-tight">{{ perm.label }}</p>
                  <p class="text-[10px] text-slate-400 mt-0.5 leading-tight">{{ perm.description }}</p>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
