<div class="flex h-dvh overflow-hidden bg-slate-50">
  <div class="hidden lg:block shrink-0">
    <app-sidebar [collapsed]="sidebarCollapsed()" (toggleSidebar)="toggleSidebar()" />
  </div>

  <div [class.hidden]="!mobileSidebarOpen()" class="fixed inset-0 z-[180] lg:hidden">
    <button type="button" class="absolute inset-0 bg-slate-900/40" (click)="closeMobileSidebar()" aria-label="Cerrar menu"></button>
    <div class="relative z-[181] h-full w-72 max-w-[86vw] bg-white  [&_aside]:!border-r-0">
      <button type="button" class="absolute right-3 top-3 z-[182] flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-700" (click)="closeMobileSidebar()" aria-label="Cerrar menu"><i class="pi pi-times text-xs"></i></button>
      <app-sidebar [collapsed]="false" (toggleSidebar)="closeMobileSidebar()" (navigate)="closeMobileSidebar()" />
    </div>
  </div>

  <div class="flex flex-1 flex-col overflow-hidden min-w-0">
    <app-navbar (toggleSidebar)="toggleSidebar()" />
    <main class="flex-1 overflow-auto p-3 sm:p-4 lg:p-6">
      <router-outlet />
    </main>
  </div>
</div>
