<aside
  class="flex h-full flex-col bg-white transition-all duration-500 ease-in-out overflow-hidden border-r border-slate-100"
  [class.w-64]="!collapsed()"
  [class.w-20]="collapsed()"
>
  <div class="flex h-20 shrink-0 items-center border-b border-slate-50 transition-all" [class.px-7]="!collapsed()" [class.justify-center]="collapsed()">
    <div class="flex items-center gap-3 cursor-pointer group">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-[#0F172A] text-white transition-transform group-hover:scale-105">
        <i class="pi pi-heart-fill text-lg"></i>
      </div>
      <div *ngIf="!collapsed()" class="flex flex-col">
        <span class="text-[18px] font-semibold text-[#0F172A] leading-none mb-1">VargasVet</span>
        <span class="text-[9px] font-medium text-[#94A3B8] uppercase tracking-[0.22em]">Veterinary Center</span>
      </div>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto py-5 custom-scrollbar" [class.px-4]="!collapsed()" [class.px-0]="collapsed()">
    <div class="space-y-2">
      <ng-container *ngFor="let structure of menuStructure()">
        <div *ngIf="structure.vistas.length > 1" class="space-y-1">
          <button
            *ngIf="!collapsed() && structure.ventanaNombre"
            (click)="toggleSection(structure)"
            type="button"
            class="w-full flex items-center gap-3 px-3 py-3 rounded-xl transition-all duration-200 group hover:bg-slate-50"
          >
            <i [class]="sectionIcon(structure) + ' text-sm text-slate-400 group-hover:text-[#0066AA] transition-colors'"></i>
            <p class="text-xs font-bold text-[#526783] uppercase tracking-wider flex-1 text-left">{{ structure.ventanaNombre }}</p>
            <i
              class="pi text-xs text-slate-500 group-hover:text-[#0066AA] transition-all duration-200 flex-shrink-0"
              [class.pi-chevron-down]="isSectionExpanded(structure)"
              [class.pi-chevron-right]="!isSectionExpanded(structure)"
            ></i>
          </button>

          <div *ngIf="collapsed() && structure.ventanaNombre" class="flex justify-center py-2">
            <i [class]="sectionIcon(structure) + ' text-sm text-slate-400'"></i>
          </div>

          <div *ngIf="isSectionExpanded(structure)" class="space-y-1 transition-all duration-200 ease-in-out">
            <a
              *ngFor="let vista of structure.vistas"
              [routerLink]="vista.ruta"
              routerLinkActive="active-link"
              #rla="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: true }"
              [class]="navItemClass(rla.isActive)"
              class="relative block"
            >
              <div class="flex items-center w-full" [class.gap-3]="!collapsed()" [class.justify-center]="collapsed()">
                <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#EFF6FF] text-[#0066AA] flex-shrink-0">
                  <i [class]="vistaIcon(vista.codigo) + ' text-sm'"></i>
                </div>
                <span *ngIf="!collapsed()" class="flex-1 text-left whitespace-nowrap text-sm">
                  {{ vista.nombre }}
                </span>
              </div>
            </a>
          </div>
        </div>

        <a
          *ngIf="structure.vistas.length === 1"
          [routerLink]="structure.vistas[0].ruta"
          routerLinkActive="active-link"
          #rlaItem="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          [class]="navItemClass(rlaItem.isActive)"
          class="relative block"
        >
          <div class="flex items-center w-full" [class.gap-3]="!collapsed()" [class.justify-center]="collapsed()">
            <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#EFF6FF] text-[#0066AA] flex-shrink-0">
              <i [class]="vistaIcon(structure.vistas[0].codigo) + ' text-sm'"></i>
            </div>
            <span *ngIf="!collapsed()" class="flex-1 text-left whitespace-nowrap text-sm">
              {{ structure.vistas[0].nombre }}
            </span>
          </div>
        </a>
      </ng-container>
    </div>
  </nav>

  <div class="shrink-0 py-4 border-t border-slate-100 flex justify-center" [class.px-4]="!collapsed()" [class.px-0]="collapsed()">
    <button
      type="button"
      (click)="logout()"
      class="flex items-center justify-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 group hover:bg-rose-50"
      [class.w-full]="!collapsed()"
      [class.w-12]="collapsed()"
      [class.h-12]="collapsed()"
      [class.rounded-xl]="collapsed()"
    >
      <i class="pi pi-sign-out text-sm text-slate-400 group-hover:text-rose-500 transition-colors"></i>
      <span *ngIf="!collapsed()" class="text-sm font-medium text-slate-500 group-hover:text-rose-500 whitespace-nowrap transition-colors">Cerrar Sesión</span>
    </button>
  </div>
</aside>

<style>
  .custom-scrollbar::-webkit-scrollbar { width: 0; }
  .active-link {
    background-color: #EFF6FF !important;
    color: #0066AA !important;
    border: 0 !important;
  }
</style>
