<aside
  class="flex h-full flex-col bg-white border-r border-slate-100 transition-all duration-300 ease-in-out overflow-hidden"
  [class.w-64]="!collapsed()"
  [class.w-16]="collapsed()"
>
  <div
    class="flex h-16 shrink-0 items-center border-b border-slate-100 px-4"
    [class.justify-center]="collapsed()"
  >
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-[#0066AA]">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 21.35L10.55 20.03C5.4 15.36 2 12.27 2 8.5C2 5.41 4.41 3 7.5 3C9.24 3 10.91 3.81 12 5.08C13.09 3.81 14.76 3 16.5 3C19.59 3 22 5.41 22 8.5C22 12.27 18.6 15.36 13.45 20.03L12 21.35Z"
            fill="white"
          />
          <path
            d="M12 13C13.6569 13 15 11.6569 15 10C15 8.34315 13.6569 7 12 7C10.3431 7 9 8.34315 9 10C9 11.6569 10.3431 13 12 13Z"
            fill="#0066AA"
          />
        </svg>
      </div>
      <span *ngIf="!collapsed()" class="text-base font-bold text-slate-900 whitespace-nowrap tracking-tight">
        VargasVet
      </span>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto py-4 px-2">
    <ul class="space-y-0.5">
      <li *ngFor="let item of visibleNavItems">
        <a
          [routerLink]="item.route"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          [class]="navItemClass(rla.isActive)"
          [title]="collapsed() ? item.label : ''"
        >
          <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="item.icon" />
          </svg>
          <span *ngIf="!collapsed()" class="whitespace-nowrap">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>
  <div class="shrink-0 border-t border-slate-100 p-3 space-y-1">
    <div *ngIf="!collapsed()" class="px-3 py-2">
      <p class="text-xs font-semibold text-slate-800 truncate">{{ userName() }}</p>
      <p class="text-xs text-slate-400 truncate">{{ companyName() }}</p>
    </div>
    <button
      type="button"
      (click)="logout()"
      [title]="collapsed() ? 'Cerrar sesión' : ''"
      [class]="'flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition-colors duration-150 ' + (collapsed() ? 'justify-center' : '')"
    >
      <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span *ngIf="!collapsed()" class="whitespace-nowrap">Cerrar sesión</span>
    </button>
  </div>
</aside>
