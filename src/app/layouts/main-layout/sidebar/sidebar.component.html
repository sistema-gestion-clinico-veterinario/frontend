<aside
  class="flex h-full flex-col bg-white transition-all duration-500 ease-in-out overflow-hidden border-r border-slate-50"
  [class.w-64]="!collapsed()"
  [class.w-20]="collapsed()"
>
  <!-- Header Minimalista Centrado -->
  <div class="flex h-16 shrink-0 items-center transition-all" [class.px-6]="!collapsed()" [class.justify-center]="collapsed()">
    <div class="flex items-center gap-3 cursor-pointer group">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-[#0F172A] text-white transition-transform group-hover:scale-105">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21.35L10.55 20.03C5.4 15.36 2 12.27 2 8.5C2 5.41 4.41 3 7.5 3C9.24 3 10.91 3.81 12 5.08C13.09 3.81 14.76 3 16.5 3C19.59 3 22 5.41 22 8.5C22 12.27 18.6 15.36 13.45 20.03L12 21.35Z" fill="currentColor"/>
        </svg>
      </div>
      <div *ngIf="!collapsed()" class="flex flex-col">
        <span class="text-[18px] font-medium text-[#0F172A] tracking-tighter leading-none mb-0.5">VargasVet</span>
        <span class="text-[8px] font-normal text-[#94A3B8] uppercase tracking-[0.2em]">Veterinary Center</span>
      </div>
    </div>
  </div>

  <!-- Navegación "Flat" Centrada -->
  <nav class="flex-1 overflow-y-auto py-6 custom-scrollbar" [class.px-3]="!collapsed()" [class.px-0]="collapsed()">
    <ul class="space-y-0.5">
      <ng-container *ngFor="let item of menuItems(); let first = first">
        <li *ngIf="!first && !collapsed()" class="py-1 px-3">
          <div class="h-[1px] bg-slate-50/50 w-full"></div>
        </li>
        <ng-container *ngTemplateOutlet="recursiveMenu; context:{ $implicit: [item], level: 0 }"></ng-container>
      </ng-container>
    </ul>
  </nav>

  <!-- Solo Cerrar Sesión (Alineado al Centro) -->
  <div class="shrink-0 py-6 border-t border-slate-50 flex justify-center" [class.px-6]="!collapsed()" [class.px-0]="collapsed()">
    <button
      type="button"
      (click)="logout()"
      class="flex items-center justify-center transition-all duration-200 group"
      [class.gap-3]="!collapsed()"
      [class.w-12]="collapsed()"
      [class.h-12]="collapsed()"
      [class.rounded-xl]="collapsed()"
      [class.px-4]="!collapsed()"
      [class.py-2]="!collapsed()"
    >
      <i class="pi pi-power-off text-base opacity-40 group-hover:opacity-100 group-hover:text-rose-500"></i>
      <span *ngIf="!collapsed()" class="text-[12px] font-medium text-[#94A3B8] hover:text-[#0F172A] whitespace-nowrap">Cerrar Sesión</span>
    </button>
  </div>
</aside>

<!-- Template Recursivo "Flat" -->
<ng-template #recursiveMenu let-list let-level="level">
  <li *ngFor="let item of list">
    
    <ng-container *ngIf="item.children && item.children.length > 0; else singleLink">
      <button
        type="button"
        (click)="toggleSubmenu(item.id, $event)"
        [class]="navItemClass(isMenuOpen(item.id), level)"
        [style.padding-left.px]="!collapsed() ? (level * 20 + 12) : 0"
        class="w-full relative group/btn"
      >
        <div class="flex items-center w-full" [class.gap-3]="!collapsed()" [class.justify-center]="collapsed()">
          <i [class]="item.icon" 
             class="transition-colors text-[16px]"
             [class.text-[#0F172A]]="isMenuOpen(item.id) || level === 0"></i>
          <span *ngIf="!collapsed()" class="flex-1 text-left whitespace-nowrap tracking-tight">{{ item.label }}</span>
          <i *ngIf="!collapsed()" class="pi pi-angle-right text-[12px] text-[#0F172A] opacity-20 transition-transform duration-300"
             [class.rotate-90]="isMenuOpen(item.id)"
             [class.opacity-60]="isMenuOpen(item.id)"></i>
        </div>
      </button>

      <ul *ngIf="isMenuOpen(item.id) && !collapsed()" 
          class="space-y-0.5 animate-in fade-in duration-300">
        <ng-container *ngTemplateOutlet="recursiveMenu; context:{ $implicit: item.children, level: level + 1 }"></ng-container>
      </ul>
    </ng-container>

    <ng-template #singleLink>
      <a
        [routerLink]="item.path"
        routerLinkActive="active-link"
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [class]="navItemClass(rla.isActive, level)"
        [style.padding-left.px]="!collapsed() ? (level * 20 + 12) : 0"
        class="relative"
      >
        <div class="flex items-center" [class.gap-3]="!collapsed()" [class.justify-center]="collapsed()">
          <i [class]="item.icon"
             class="text-[16px] transition-all"
             [class.text-[#0F172A]]="rla.isActive"></i>
          <span *ngIf="!collapsed()" class="whitespace-nowrap tracking-tight">{{ item.label }}</span>
        </div>
        <div *ngIf="rla.isActive && !collapsed()" 
             class="absolute right-0 top-1/2 -translate-y-1/2 w-0.5 h-3 bg-[#0F172A] rounded-l-full">
        </div>
      </a>
    </ng-template>

  </li>
</ng-template>

<style>
  .custom-scrollbar::-webkit-scrollbar { width: 0px; }
  .active-link {
    background-color: transparent !important;
    color: #0F172A !important;
  }
</style>
