<aside
  class="flex h-full flex-col overflow-hidden border-r border-white/10 transition-all duration-300 ease-in-out"
  [style.background]="'#004F85'"
  [class.w-[17rem]]="!collapsed()"
  [class.w-20]="collapsed()"
>
  <div class="flex min-h-20 shrink-0 items-center justify-center border-b border-white/15 px-3 py-3 transition-all">
    <div class="flex items-center gap-3 cursor-pointer group">
      <img *ngIf="companyLogoUrl()" [src]="companyLogoUrl()" alt="Logo"
        class="h-10 w-10 shrink-0 rounded-xl border border-white/20 object-cover transition-transform group-hover:scale-105" />
      <div *ngIf="!companyLogoUrl()" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/20 text-white transition-transform group-hover:scale-105">
        <i class="pi pi-heart-fill text-lg"></i>
      </div>
      <div *ngIf="!collapsed()" class="flex flex-col gap-1">
        <span *ngIf="loadingEnterprise()" class="h-4 w-28 animate-pulse rounded bg-white/20"></span>
        <span *ngIf="!loadingEnterprise()" class="mb-1 max-w-[172px] text-lg font-semibold leading-tight text-white">{{ companyName() || '' }}</span>
      </div>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto py-5 custom-scrollbar" [class.px-4]="!collapsed()" [class.px-0]="collapsed()">
    <div class="space-y-2">
      <ng-container *ngIf="menuStructure().length === 0 && !collapsed()">
        <div class="space-y-3 px-3">
          <div *ngFor="let i of [1,2,3,4,5]" class="flex items-center gap-3">
            <p-skeleton shape="circle" size="2rem" [style]="{ background: 'rgba(255,255,255,0.15)' }" />
            <p-skeleton height="0.75rem" width="70%" [style]="{ background: 'rgba(255,255,255,0.15)' }" />
          </div>
        </div>
      </ng-container>
      <ng-container *ngFor="let structure of menuStructure()">
        <div *ngIf="structure.vistas.length > 1" class="space-y-1">
          <button
            *ngIf="!collapsed() && structure.ventanaNombre"
            (click)="toggleSection(structure)"
            type="button"
            class="group flex w-full items-center gap-3 rounded-lg px-3 py-3 transition-colors duration-150 hover:bg-white/10"
          >
            <i [class]="sectionIcon(structure) + ' text-sm text-white/90 transition-colors'"></i>
            <p class="flex-1 text-left text-xs font-bold uppercase tracking-wider text-white/90">{{ structure.ventanaNombre }}</p>
            <i
              class="pi flex-shrink-0 text-xs text-white/70 transition-transform duration-200"
              [class.pi-chevron-down]="isSectionExpanded(structure)"
              [class.pi-chevron-right]="!isSectionExpanded(structure)"
            ></i>
          </button>

          <div *ngIf="collapsed() && structure.ventanaNombre" class="flex justify-center py-2">
            <i [class]="sectionIcon(structure) + ' text-sm text-white/90'"></i>
          </div>

          <div *ngIf="isSectionExpanded(structure)" class="space-y-1 transition-all duration-200 ease-in-out">
            <a
              *ngFor="let vista of structure.vistas"
              [routerLink]="vista.ruta"
              routerLinkActive="active-link"
              #rla="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="navigate.emit()"
              [class]="navItemClass(rla.isActive)"
              class="relative block"
            >
              <div class="flex items-center w-full" [class.gap-3]="!collapsed()" [class.justify-center]="collapsed()">
                <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center text-white">
                  <i [class]="getIcon(vista) + ' text-sm'"></i>
                </div>
                <span *ngIf="!collapsed()" class="flex-1 whitespace-nowrap text-left text-sm text-white">
                  {{ vista.nombre }}
                </span>
              </div>
            </a>
          </div>
        </div>

        <a
          *ngIf="structure.vistas.length === 1"
          [routerLink]="structure.vistas[0].ruta"
          routerLinkActive="active-link"
          #rlaItem="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="navigate.emit()"
          [class]="navItemClass(rlaItem.isActive)"
          class="relative block"
        >
          <div class="flex items-center w-full" [class.gap-3]="!collapsed()" [class.justify-center]="collapsed()">
            <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center text-white">
              <i [class]="getIcon(structure.vistas[0]) + ' text-sm'"></i>
            </div>
            <span *ngIf="!collapsed()" class="flex-1 whitespace-nowrap text-left text-sm text-white">
              {{ structure.vistas[0].nombre }}
            </span>
          </div>
        </a>
      </ng-container>
    </div>
  </nav>

  <div class="flex shrink-0 justify-center border-t border-white/15 py-4" [class.px-4]="!collapsed()" [class.px-0]="collapsed()">
    <button
      type="button"
      (click)="logout()"
      class="group flex items-center justify-center gap-3 rounded-lg px-3 py-2.5 transition-colors duration-150 hover:bg-white/10"
      [class.w-full]="!collapsed()"
      [class.w-12]="collapsed()"
      [class.h-12]="collapsed()"
      [class.rounded-xl]="collapsed()"
    >
      <i class="pi pi-sign-out text-sm text-white/80 transition-colors"></i>
      <span *ngIf="!collapsed()" class="whitespace-nowrap text-sm font-medium text-white/90 transition-colors">Cerrar Sesión</span>
    </button>
  </div>
</aside>

<style>
  .custom-scrollbar::-webkit-scrollbar { width: 0; }
  :host .active-link span { font-weight: 700; }
</style>
