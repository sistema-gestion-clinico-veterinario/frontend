<div class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
  <!-- Modal Card -->
  <div class="bg-white w-full max-w-md rounded-2xl border border-slate-100 overflow-hidden">
    
    <!-- Modal Header -->
    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Padlock Icon Container -->
        <div class="w-9 h-9 bg-amber-50 text-amber-600 rounded-lg flex items-center justify-center">
          <i class="pi pi-lock text-base"></i>
        </div>
        <div>
          <h2 class="text-sm font-bold text-slate-800">Cambiar contraseña</h2>
          <p class="text-xs text-slate-400">Tu contraseña actual es tu número de DNI</p>
        </div>
      </div>
      
      <!-- Close Button -->
      <button type="button" (click)="dismissed.emit()"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
        title="Cerrar modal">
        <i class="pi pi-times text-xs"></i>
      </button>
    </div>

    <!-- Modal Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="px-6 py-5 space-y-4">

      <!-- Error Alert -->
      <div *ngIf="errorMsg()" class="flex items-center gap-2 bg-rose-50 text-rose-600 text-xs font-semibold px-3.5 py-2.5 rounded-lg border border-rose-100">
        <i class="pi pi-exclamation-circle text-sm shrink-0"></i>
        <span>{{ errorMsg() }}</span>
      </div>

      <!-- Current Password Input -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-slate-700">Contraseña actual (tu DNI)</label>
        <div class="relative">
          <input [type]="showOld() ? 'text' : 'password'" formControlName="oldPassword"
            placeholder="Ingresa tu DNI"
            class="w-full px-3 py-2.5 pr-10 border border-slate-300 rounded-lg text-sm focus:border-[#0066AA] focus:ring-1 focus:ring-[#0066AA] outline-none transition-all duration-150 text-slate-800" />
          <button type="button" (click)="showOld.set(!showOld())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
            <i [class]="showOld() ? 'pi pi-eye-slash text-xs' : 'pi pi-eye text-xs'"></i>
          </button>
        </div>
        <p *ngIf="form.get('oldPassword')?.touched && form.get('oldPassword')?.errors?.['pattern']" class="text-[10px] text-rose-500 mt-1">
          No debe contener espacios.
        </p>
      </div>

      <!-- New Password Input -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-slate-700">Nueva contraseña</label>
        <div class="relative">
          <input [type]="showNew() ? 'text' : 'password'" formControlName="newPassword"
            placeholder="Mínimo 6 caracteres"
            class="w-full px-3 py-2.5 pr-10 border border-slate-300 rounded-lg text-sm focus:border-[#0066AA] focus:ring-1 focus:ring-[#0066AA] outline-none transition-all duration-150 text-slate-800" />
          <button type="button" (click)="showNew.set(!showNew())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
            <i [class]="showNew() ? 'pi pi-eye-slash text-xs' : 'pi pi-eye text-xs'"></i>
          </button>
        </div>
        
        <!-- Password Strength Meter -->
        <div *ngIf="form.get('newPassword')?.value" class="mt-2 space-y-1">
          <div class="flex gap-1 h-1">
            <div *ngFor="let i of [0, 1, 2, 3]" [class]="strengthClass(i)" class="flex-1 rounded-full transition-all duration-300"></div>
          </div>
          <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase tracking-wider">
            <span>Seguridad:</span>
            <span [ngClass]="{
              'text-rose-500': passwordStrength <= 1,
              'text-amber-500': passwordStrength === 2,
              'text-blue-500': passwordStrength === 3,
              'text-emerald-500': passwordStrength === 4
            }">{{ strengthLabel() }}</span>
          </div>
        </div>
        <p *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['minlength']" class="text-[10px] text-rose-500 mt-1">
          Debe tener al menos 6 caracteres.
        </p>
        <p *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['pattern']" class="text-[10px] text-rose-500 mt-1">
          No debe contener espacios.
        </p>
      </div>

      <!-- Confirm Password Input -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-slate-700">Confirmar nueva contraseña</label>
        <div class="relative">
          <input [type]="showConfirm() ? 'text' : 'password'" formControlName="confirmPassword"
            placeholder="Repite la nueva contraseña"
            class="w-full px-3 py-2.5 pr-10 rounded-lg text-sm outline-none transition-all duration-150 text-slate-800"
            [class]="form.errors?.['mismatch'] && form.get('confirmPassword')?.dirty
              ? 'border border-rose-300 focus:border-rose-500 focus:ring-1 focus:ring-rose-500'
              : 'border border-slate-300 focus:border-[#0066AA] focus:ring-1 focus:ring-[#0066AA]'" />
          <button type="button" (click)="showConfirm.set(!showConfirm())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
            <i [class]="showConfirm() ? 'pi pi-eye-slash text-xs' : 'pi pi-eye text-xs'"></i>
          </button>
        </div>
        <p *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.errors?.['minlength']" class="text-[10px] text-rose-500 mt-1">
          Debe tener al menos 6 caracteres.
        </p>
        <p *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.errors?.['pattern']" class="text-[10px] text-rose-500 mt-1">
          No debe contener espacios.
        </p>
        <!-- Mismatch Error -->
        <p *ngIf="form.errors?.['mismatch'] && form.get('confirmPassword')?.dirty"
          class="text-[10px] text-rose-500 mt-1">Las contraseñas no coinciden</p>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3 pt-2">
        <button type="button" (click)="dismissed.emit()"
          class="flex-1 py-2.5 border border-slate-200 rounded-lg text-sm font-semibold text-slate-500 hover:bg-slate-50 transition-colors">
          Ahora no
        </button>
        <button type="submit" [disabled]="isSubmitting() || form.invalid"
          class="flex-1 bg-[#0066AA] hover:bg-[#005a96] disabled:opacity-60 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors flex items-center justify-center gap-2 cursor-pointer">
          <i *ngIf="isSubmitting()" class="pi pi-spin pi-spinner text-xs"></i>
          {{ isSubmitting() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>

    </form>
  </div>
</div>
