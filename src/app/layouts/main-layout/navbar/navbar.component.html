<header class="flex h-16 shrink-0 items-center gap-4 border-b border-slate-100 bg-white px-4">
  <!-- Toggle sidebar -->
  <button
    (click)="toggleSidebar.emit()"
    class="rounded-xl p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-colors duration-150"
    title="Contraer menú"
  >
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <div class="flex-1"></div>

  <!-- Info del usuario -->
  <div class="flex items-center gap-3">
    <div class="hidden text-right sm:block">
      <p class="text-sm font-semibold text-slate-800 leading-tight">{{ userName }}</p>
      <p class="text-xs text-slate-400 leading-tight">{{ companyName }}</p>
    </div>
    <div
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#0066AA] text-sm font-bold text-white"
    >
      {{ userInitial }}
    </div>
  </div>
</header>
