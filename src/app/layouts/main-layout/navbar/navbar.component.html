<header class="flex h-16 shrink-0 items-center gap-4 border-b border-slate-100 bg-white px-4">
  <button
    (click)="toggleSidebar.emit()"
    class="rounded-xl p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-colors duration-150"
    title="Contraer menú"
  >
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <div class="flex-1 flex items-center px-4 sm:px-8">
    <div *ngIf="isSuperAdmin" class="flex items-center gap-3">
      <!-- Sede/Empresa Dropdown -->
      <div id="company-dropdown-container" class="relative">
        <button
          type="button"
          (click)="companyDropdownOpen.set(!companyDropdownOpen())"
          class="flex items-center bg-transparent hover:bg-slate-50 rounded-xl pl-2.5 pr-7 py-1 transition-all duration-200 group focus:outline-none relative"
        >
          <i class="pi pi-building text-[#0066AA] text-sm shrink-0 mr-2 opacity-80 group-hover:opacity-100 transition-opacity"></i>
          <div class="flex flex-col text-left">
            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider leading-none mb-0.5 select-none">Empresa</span>
            <span class="font-semibold text-slate-800 text-xs truncate max-w-[130px] sm:max-w-[180px] select-none">
              {{ activeCompanyLabel }}
            </span>
          </div>
          <i class="pi pi-chevron-down absolute right-2 text-slate-400 text-[9px] pointer-events-none group-hover:text-slate-600 transition-all duration-200"
             [class.rotate-180]="companyDropdownOpen()"></i>
        </button>

        <!-- Dropdown Menu -->
        <div *ngIf="companyDropdownOpen()"
          class="absolute left-0 top-full mt-1.5 w-52 bg-white rounded-xl shadow-lg border border-slate-100 py-1 z-50 animate-in fade-in slide-in-from-top-1 duration-150">
          <button *ngFor="let c of companies()"
            (click)="selectCompany(c.value)"
            class="w-full flex items-center justify-between px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-[#0066AA] transition-colors text-left"
          >
            <span class="truncate">{{ c.label }}</span>
            <i *ngIf="c.value === activeCompanyId" class="pi pi-check text-[#0066AA] text-[10px]"></i>
          </button>
        </div>
      </div>

    </div>

    <!-- Active Role Switcher Dropdown -->
    <div *ngIf="authStore.assignedRoles().length > 1" id="active-role-dropdown-container" class="relative">
      <button
        type="button"
        (click)="activeRoleDropdownOpen.set(!activeRoleDropdownOpen())"
        class="flex items-center bg-transparent hover:bg-slate-50 rounded-xl pl-2.5 pr-7 py-1 transition-all duration-200 group focus:outline-none relative"
      >
        <i class="pi pi-users text-indigo-600 text-sm shrink-0 mr-2 opacity-80 group-hover:opacity-100 transition-opacity"></i>
        <div class="flex flex-col text-left">
          <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider leading-none mb-0.5 select-none">Rol Activo</span>
          <span class="font-semibold text-slate-800 text-xs truncate max-w-[130px] sm:max-w-[180px] select-none">
            {{ activeRoleLabelText }}
          </span>
        </div>
        <i class="pi pi-chevron-down absolute right-2 text-slate-400 text-[9px] pointer-events-none group-hover:text-slate-600 transition-all duration-200"
           [class.rotate-180]="activeRoleDropdownOpen()"></i>
      </button>

      <!-- Dropdown Menu -->
      <div *ngIf="activeRoleDropdownOpen()"
        class="absolute left-0 top-full mt-1.5 w-52 bg-white rounded-xl shadow-lg border border-slate-100 py-1 z-50 animate-in fade-in slide-in-from-top-1 duration-150">
        <button *ngFor="let role of authStore.assignedRoles()"
          (click)="selectActiveRole(role)"
          class="w-full flex items-center justify-between px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-indigo-600 transition-colors text-left"
        >
          <span class="truncate">{{ getRoleLabel(role) }}</span>
          <i *ngIf="role === authStore.roles()[0]" class="pi pi-check text-indigo-600 text-[10px]"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- User menu -->
  <div id="user-menu-container" class="relative flex items-center gap-3 shrink-0">
    <div class="hidden text-right sm:block">
      <p class="text-sm font-semibold text-slate-800 leading-tight">{{ userName }}</p>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5" *ngIf="!isSuperAdmin">{{ companyName }}</p>
      <p class="text-[10px] font-bold text-rose-500 uppercase tracking-widest mt-0.5" *ngIf="isSuperAdmin">Super Admin</p>
    </div>
    <button
      (click)="toggleDropdown()"
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#0066AA] text-sm font-bold text-white hover:ring-2 hover:ring-[#0066AA]/40 transition-all"
    >
      {{ userInitial }}
    </button>

    <!-- Dropdown -->
    <div *ngIf="dropdownOpen()"
      class="absolute right-0 top-12 w-48 bg-white rounded-xl shadow-lg border border-slate-100 py-1 z-50">
      <button (click)="goToProfile()"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
        <i class="pi pi-user text-slate-400 text-sm"></i>
        Mi perfil
      </button>
      <button (click)="goToPasswordChange()"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
        <i class="pi pi-lock text-slate-400 text-sm"></i>
        Cambiar contraseña
      </button>
      <div class="border-t border-slate-100 my-1"></div>
      <button (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
        <i class="pi pi-sign-out text-red-400 text-sm"></i>
        Cerrar sesión
      </button>
    </div>
  </div>
</header>
